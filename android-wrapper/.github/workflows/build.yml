name: Build MalaMusic APK

on:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
  pull_request:
    branches: [main]
    paths:
      - 'android-wrapper/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android-wrapper/gradlew

      - name: Build Debug APK
        working-directory: android-wrapper
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalaMusic-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: android-wrapper
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MalaMusic-release
          path: android-wrapper/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
